# Moonboard Grade Prediction - Filtered Configuration
# This config trains on a filtered subset of grades (6A+ through 7C) for better performance

# Model Configuration
model:
  type: "cnn"  # Options: "fc" (fully connected) or "cnn" (convolutional)
  num_classes: 10  # Number of filtered grade classes (6A+ to 7C)

# Training Configuration
training:
  learning_rate: 0.0003
  batch_size: 64
  num_epochs: 150
  early_stopping_patience: 15
  optimizer: "adam"  # Options: "adam", "sgd"
  weight_decay: 0.001
  use_class_weights: true
  max_class_weight: 10.0  # Increased from 5.0 for better handling of imbalanced filtered data
  scheduler:
    type: "cosine"
    horizon_epochs: 150
    eta_min: 0.0000001
  loss_type: "focal_ordinal"
  focal_gamma: 2.0
  ordinal_weight: 0.5
  ordinal_alpha: 2.0
  label_smoothing: 0.0  # Only used by "ce" and "label_smoothing" loss types
  gradient_clip: 1.0
  deterministic: true

# Data Configuration
data:
  path: "../data/problems.json"  # Path to training data JSON file
  # Grade Filtering Configuration
  filter_grades: true
  min_grade_index: 2   # 6A+
  max_grade_index: 11  # 7C
  
  # Repeats Filtering Configuration
  filter_repeats: false  # Enable/disable repeats filtering
  min_repeats: 1         # Minimum number of repeats (0 = include all, 1 = exclude zero-repeat routes)
  group_by_layout: true  # Keep duplicate hold layouts in the same split

# Frozen benchmark and repeated grouped validation
experiment:
  outer_test_ratio: 0.15
  outer_seed: 42
  cv_folds: 5
  cv_seeds: [42, 43, 44]
  refit_seed: 42
  primary_metric: "tolerance_1_accuracy"

# Checkpoint Configuration
checkpoint:
  dir: "models"  # Directory to save model checkpoints
  save_best: true  # Save best model based on validation loss
  save_final: true  # Save final model after training

# Device Configuration
device: "cuda"  # Options: "cuda" (GPU) or "cpu"

# Evaluation Configuration
evaluation:
  tolerance_levels: [1, 2]  # Calculate accuracy within ±N grades
  save_confusion_matrix: true
  confusion_matrix_path: "models/confusion_matrix_filtered.png"

# Prediction Configuration
prediction:
  top_k: 3  # Return top K predictions with probabilities

