[project]
name = "moonboard-grader"
version = "0.1.0"
description = "Shared development environment for the Moonboard Grader Python projects"
requires-python = ">=3.10"
dependencies = [
    "moonboard_core[dev]",
    "moonboard-classifier[dev]",
    "moonboard-generator[dev]",
    "beta-classifier[dev]",
    "moonboard-backend",
]

[tool.uv]
package = false
constraint-dependencies = [
    "fastapi==0.121.1",
    "grpcio==1.76.0",
    "httpx==0.28.1",
    "matplotlib==3.10.7",
    "numpy==2.2.6",
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "pandas==2.3.3",
    "protobuf==6.33.0",
    "pydantic==2.12.4",
    "pydantic-core==2.41.5",
    "pytest==9.0.1",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "starlette==0.49.3",
    "tensorboard==2.20.0",
    "torch==2.9.1",
    "uvicorn==0.38.0",
]

[tool.uv.sources]
moonboard_core = { workspace = true }
moonboard-classifier = { workspace = true }
moonboard-generator = { workspace = true }
beta-classifier = { workspace = true }
moonboard-backend = { workspace = true }

[tool.uv.workspace]
members = [
    "moonboard_core",
    "classifier",
    "generator",
    "beta-classifier",
    "backend",
]
